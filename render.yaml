databases:
  - name: pfumelani-portfolio-db
    databaseName: pfumelani_portfolio
    user: pfumelani
    plan: free

services:
  - type: web
    name: pfumelani-portfolio-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py bootstrap_superuser
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/v1/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "3600"
      - key: DATABASE_URL
        fromDatabase:
          name: pfumelani-portfolio-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://pfumelanik98.github.io
